version: '3.8'

services:
  # ---------------------------
  # 1. INFRASTRUCTURE
  # ---------------------------
    # 1. The Database Backend (Required by the Emulator)
  emulator-db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: servicebus-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StrongPassword123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P StrongPassword123! -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      retries: 10
      start_period: 10s
      timeout: 3s

  # 2. The Service Bus Emulator
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: servicebus-emulator
    depends_on:
      emulator-db:
        condition: service_healthy
    ports:
      - "5672:5672"
    environment:
      - SQL_SERVER=emulator-db
      - MSSQL_SA_PASSWORD=StrongPassword123!
      - ACCEPT_EULA=Y
    volumes:
       # Mount the config file we created in Step A
      - ./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672 || exit 1"]
      interval: 5s
      retries: 20
      start_period: 5s

  # ---------------------------
  # 3. OBSERVABILITY
  # ---------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true # Enable the modern OTLP standard
    ports:
      - "16686:16686" # The UI (http://localhost:16686)
      - "4317:4317"   # OTLP gRPC Receiver (Standard for .NET)
      - "4318:4318"   # OTLP HTTP Receiver
  
